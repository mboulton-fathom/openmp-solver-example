[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2"]
build-backend = "scikit_build_core.build"

[project]
name = "jacobi-omp"
version = "0.1.0"
description = "OpenMP Jacobi 2D heat solver with a nanobind Python wrapper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click", "numpy"]

[project.scripts]
jacobi-solve = "jacobi.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/jacobi"]
build-dir = "build/{wheel_tag}"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/cpp/*.cpp" },
    { file = "src/cpp/*.hpp" },
]
